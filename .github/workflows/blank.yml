name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p extracted_project
          unzip epson-print-pro-android.zip -d extracted_project

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find project directory and build
        run: |
          PROJECT_DIR=$(dirname $(find extracted_project -name "gradlew" | head -n 1))
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
